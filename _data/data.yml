career-profile:
    title: Career Profile
    summary: |
      Mayukh Mukhopadhyay is a full-time technology consultant with more than a decade of experience in designing business continuity solutions in the midst of complex digital transformation programs. He did his M.Engg from Jadavpur University and MBA from IIT Kharagpur. He is currently pursuing PhD (Industry Track) from IIM Indore. He has authored the book Ethereum Smart Contract Development, Packt UK. He is an active Professional Member of ACM, Professional Scrum Master I, and Azure Certified Solution Architect.
education:
    - degree: PhD (Marketing)
      link: 
      university: Indian Institute of Management Indore
      time: 2022 - Pursuing
      details: |
       This program taught me how to covert real-life observations into peer-reviewed marketing literature.
          - Best Paper Award (Top 3) at International Conference [CERE 2023] (https://www.iimidr.ac.in/news-events/cere-2023-held-at-iim-indore/){:target="_blank"} among 200+ participants.
    - degree: Master of Business Administration
      link: 
      university: Indian Institute of Technology Kharagpur
      time: 2018 - 2021
      details: |
       This program taught me how to put the narrative to numbers, the story behind a data and how to articulate the insights.
          - Finalist in National Level Valuation Competition Mulyakan 2019
          - Authored book on emerging case studies [FSEBCbook](https://fsebcbook.github.io/){:target="_blank"} for Eliva Press, Moldova, EU.
    - degree: MEngg Software Engineering
      link: 
      university: Jadavpur University
      time: 2013 - 2016
      details: |
        This program taught me about coding, networking and algorithms.
          - Secured Scholarship from TCS to fund my entire coursework
          - Got published by [Lambert Publishing Germany](https://www.amazon.in/Perception-Maximum-Density-plots-virus/dp/3330349123){:target="_blank"} based on my final year thesis work.
  
experiences:
    - role: Assistant Consultant
      time: 2010 - Present
      company: Tata Consultancy Services Ltd.
      details: |
        - Conducted Webinar based Training Sessions on Map-Reduce Concepts, Sqoop
          and Oozie best practices to over 50+ TCS employee to achieve 150% increase
          in onboarding of new candidates as Hadoop developer. This won me
          ['On-the-Spot'](https://drive.google.com/file/d/15k2B-lzEwU72Jv3fluxdU2iqWFg71FUv/view?usp=sharing "July-2018"){:target="_blank"} Team award.
    - role: Software Developer (Contract)
      time: 2010 - Present
      company: British Telecommunications Plc
      details: |
        - Productionized complex hadoop-as-a-service data pipeline to integrate with
          reconciliation workflow that mitigates a revenue leakage of upto 250 million
          USD per financial year.
        - Implemented storage compaction on Hadoop based data pipeline to increase
          data density by 300%.
    - role: Technical Author and Reviewer (Contract)
      time: 2017 - 2019
      company: Packt Publishing, UK
      details: |
        - Authored a book on [Ethereum Smart Contract Development](https://scholar.google.co.in/citations?user=0fX4LNgAAAAJ&hl=en#d=gs_md_cita-d&u=%2Fcitations%3Fview_op%3Dview_citation%26hl%3Den%26user%3D0fX4LNgAAAAJ%26citation_for_view%3D0fX4LNgAAAAJ%3AIjCSPb-OGe4C%26tzom%3D-330 "cited by papers published in ieee and elsevier journals"){:target="_blank"} that generated a
          sale of 1 Million INR in first two quarters post publication. 
        - Featured on the list of [6 Best Smart Contract Development Books of All Time](https://bookauthority.org/books/best-smart-contract-development-books "As featured on CNN, Forbes and Inc by BookAuthority"){:target="_blank"}.
        - Archived by [Stanford University Library](https://searchworks.stanford.edu/view/13217580){:target="_blank"}, [IIM Bangalore Library](https://library.iimb.ac.in/ebpw/pe){:target="_blank"}, [Toronto Public Library](https://www.torontopubliclibrary.ca/detail.jsp?Entt=RDM3671343&R=3671343){:target="_blank"} and [National Library Board Singapore.](https://www.nlb.gov.sg/biblio/203196779){:target="_blank"}
        - Prescribed reference by City University of Hong Kong for [CS4389](https://www.cityu.edu.hk/catalogue/ug/201920/course/CS4389.pdf "Decentralized Applications Development"){:target="_blank"}. 
        - Technical reviewer of [Ethereum Cookbook](https://books.google.co.in/books?id=TvFsDwAAQBAJ&pg=PP7&lpg=PP7&dq=Ethereum+cookbook+reviewer+mayukh&source=bl&ots=h_rEKKiiCm&sig=ACfU3U3OXqL08r-uremaekgVNjsYy_s41w&hl=en&sa=X&ved=2ahUKEwiNwomTgIzqAhU84zgGHbJEBsIQ6AEwAHoECAoQAQ#v=onepage&q=Ethereum%20cookbook%20reviewer%20mayukh&f=false){:target="_blank"}.
