          - My final year thesis work got published by Lambert Publishing Germany and is made available at [Harvard Book Store](https://shop.harvard.com/book/9783330349124){:target="_blank"}.
  
experiences:
    - role: Assistant Consultant
      time: 2010 - Present
      company: Tata Consultancy Services Ltd.
      details: |
        - Conducted Webinar based Training Sessions on Map-Reduce Concepts, Sqoop
          and Oozie best practices to over 50+ TCS employee to achieve 150% increase
          in onboarding of new candidates as Hadoop developer. This won me 'On-the-Spot' Team award.
    - role: Solution Designer (Contract)
      time: 2010 - Present
      company: British Telecommunications Plc
      details: |
        - Productionized complex hadoop-as-a-service data pipeline to integrate with
          reconciliation workflow that mitigates a revenue leakage of upto 250 million
          USD per financial year.
        - Implemented storage compaction on Hadoop based data pipeline to increase
          data density by 300%.
    - role: Technical Author and Reviewer (Pro Bono)
      time: 2017 - 2019
      company: Packt Publishing, UK
      details: |
        - Authored a book on [Ethereum Smart Contract Development](https://scholar.google.co.in/citations?user=0fX4LNgAAAAJ&hl=en#d=gs_md_cita-d&u=%2Fcitations%3Fview_op%3Dview_citation%26hl%3Den%26user%3D0fX4LNgAAAAJ%26citation_for_view%3D0fX4LNgAAAAJ%3AIjCSPb-OGe4C%26tzom%3D-330 "cited by papers published in ieee and elsevier journals"){:target="_blank"} that generated a
          sale of 1 Million INR in first two quarters post publication. 
        - Featured on the list of [6 Best Smart Contract Development Books of All Time](https://bookauthority.org/books/best-smart-contract-development-books "As featured on CNN, Forbes and Inc by BookAuthority"){:target="_blank"}.
        - Archived by [Stanford University Library](https://searchworks.stanford.edu/view/13217580){:target="_blank"}, [IIM Bangalore Library](https://library.iimb.ac.in/ebpw/pkt-list){:target="_blank"}, [Boston Public Library](https://bpl.bibliocommons.com/v2/record/S75C8626793){:target="_blank"}, and [National Library Board Singapore.](https://www.nlb.gov.sg/biblio/203196779){:target="_blank"}
        - Prescribed reference by City University of Hong Kong for [CS4389](https://www.cityu.edu.hk/catalogue/ug/201920/course/CS4389.pdf "Decentralized Applications Development"){:target="_blank"}. 
        - Technical reviewer of [Ethereum Cookbook](https://books.google.co.in/books?id=TvFsDwAAQBAJ&pg=PP7&lpg=PP7&dq=Ethereum+cookbook+reviewer+mayukh&source=bl&ots=h_rEKKiiCm&sig=ACfU3U3OXqL08r-uremaekgVNjsYy_s41w&hl=en&sa=X&ved=2ahUKEwiNwomTgIzqAhU84zgGHbJEBsIQ6AEwAHoECAoQAQ#v=onepage&q=Ethereum%20cookbook%20reviewer%20mayukh&f=false){:target="_blank"}, [Learning Ethereum 2.0](https://www.youtube.com/watch?v=yZNw-xttNzI){:target="_blank"}, and [Data Science for Web3](https://www.youtube.com/watch?v=bCeZmtC6_h4){:target="_blank"}.
