career-profile:
    title: Career Profile
    summary: |
      I am a full-time technology consultant, having spent over thirteen years crafting business continuity solutions within intricate digital transformation initiatives. My academic journey includes an [M.Engg from Jadavpur University](https://mayukhpsm.github.io/online-cv/JU_MEngg_2016.pdf){:target="_blank"} and an [MBA from IIT Kharagpur](https://mayukhpsm.github.io/online-cv/IITKGP_MBA_2021.pdf){:target="_blank"}. Presently, I'm immersed in pursuing a PhD (Industry Track) at IIM Indore. I authored the book "Ethereum Smart Contract Development" published by Packt UK. My active involvement extends to being a Professional Member of ACM, holding certifications as a Professional Scrum Master I, and being an Azure Certified Solution Architect. I like to spend my leisure time peer-reviewing business and technical research papers for IEEE conferences and scopus-indexed journals.
